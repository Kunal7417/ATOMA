spring:
  application:
    name: atoma-marketplace
  profiles:
    active: dev

server:
  port: 8090

atoma:
  security:
    jwt-secret: ${JWT_SECRET:atoma-marketplace-dev-secret-key-min-256-bits-long!!}
    jwt-expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
