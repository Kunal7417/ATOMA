spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  application:
    name: atoma-marketplace
  profiles:
    active: dev

server:
  port: 8090

atoma:
  security:
    jwt-secret: ${JWT_SECRET:atoma-marketplace-dev-secret-key-min-256-bits-long!!}
    jwt-expiration-ms: 86400000
    merchant-access-token-expiration-ms: 900000
  otp:
    expose-code: false
    dev-bypass-code: "000000"
    resend-cooldown-seconds: 60
    ttl-minutes: 5
    max-wrong-attempts: 5
  app:
    min-merchant-version: "0.1.0"
    enforce-version-header: true
  onboarding:
    upload:
      max-file-size-bytes: 10485760

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
