spring:
  application:
    name: atoma-marketplace
  profiles:
    active: dev

server:
  port: 8090

atoma:
  security:
    jwt-secret: ${JWT_SECRET:atoma-marketplace-dev-secret-key-min-256-bits-long!!}
    jwt-expiration-ms: 86400000
  otp:
    expose-code: false
    dev-bypass-code: "000000"
    resend-cooldown-seconds: 60
    ttl-minutes: 5
    max-wrong-attempts: 5
  app:
    min-merchant-version: "1.0.0"
    enforce-version-header: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
