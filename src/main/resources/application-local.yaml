# Local development against PostgreSQL (Docker Compose or native install).
#
# REQUIRED: Postgres must be listening before bootRun, or Flyway fails with
# "Connection to localhost:5432 refused" and JPA will not start.
#
#   docker compose up -d postgres
#   docker compose ps postgres   # wait until healthy
#   ./gradlew bootRun -Pprofile=local
spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:atoma_marketplace}
    username: ${DB_USER:atoma}
    password: ${DB_PASSWORD:atoma}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

logging:
  level:
    com.atoma.marketplace: DEBUG
    org.flywaydb: INFO
