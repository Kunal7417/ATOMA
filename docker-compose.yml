services:
  postgres:
    image: postgres:15-alpine
    container_name: atoma-postgres
    environment:
      POSTGRES_DB: atoma_marketplace
      POSTGRES_USER: atoma
      POSTGRES_PASSWORD: atoma
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atoma -d atoma_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: atoma-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: atoma-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
